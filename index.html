<!DOCTYPE html>

  <title>採用情報 | 株式会社ハルケア</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; color: #333; }

    header {
      background-color: #4CAF91;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      background-color: #f0faf5;
      text-align: center;
      padding: 80px 20px;
    }
    .hero h2 { font-size: 32px; margin-bottom: 16px; color: #2e7d5e; }
    .hero p { font-size: 18px; color: #555; margin-bottom: 32px; }
    .hero a {
      background-color: #4CAF91;
      color: white;
      padding: 14px 32px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
    }

    .section {
      padding: 60px 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    .section h2 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #2e7d5e;
      border-left: 4px solid #4CAF91;
      padding-left: 12px;
    }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      flex: 1;
      min-width: 200px;
      background: #f9f9f9;
      border-radius: 8px;
      padding: 24px;
    }
    .card h3 { margin-bottom: 8px; color: #2e7d5e; }

    footer {
      background-color: #2e7d5e;
      color: white;
      text-align: center;

  <header>

    <nav>

    </nav>
  </header>

  <div class="hero">

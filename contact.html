<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 株式会社ハルケア</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; color: #333; }

    header {
      background-color: #4CAF91;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .page-hero {
      background-color: #f0faf5;
      text-align: center;
      padding: 48px 20px;
    }
    .page-hero h2 { font-size: 28px; color: #2e7d5e; }
    .page-hero p { color: #555; margin-top: 12px; }

    .section {
      padding: 60px 40px;
      max-width: 640px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #2e7d5e;
    }
    .form-group span {
      background: #4CAF91;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 8px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      font-family: sans-serif;
    }
    .form-group textarea { height: 160px; resize: vertical; }

    .submit-btn {
      display: block;
      width: 100%;
      background-color: #4CAF91;
      color: white;
      padding: 16px;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .submit-btn:hover { background-color: #3a9d7e; }

    .back-link {
      display: block;
      text-align: center;
      color: #4CAF91;
      text-decoration: none;
    }

    .info-box {
      background: #f0faf5;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 40px;
      text-align: center;
    }
    .info-box h3 { color: #2e7d5e; margin-bottom: 8px; }
    .info-box p { color: #555; font-size: 14px; }
    .info-box .tel {
      font-size: 24px;
      color: #2e7d5e;
      font-weight: bold;
      margin: 8px 0;
    }

    footer {
      background-color: #2e7d5e;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">株式会社ハルケア</a>
    <nav>
      <a href="jobs.html">仕事紹介</a>
      <a href="workplace.html">職場環境</a>
      <a href="requirements.html">募集要項</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </header>

  <div class="page-hero">
    <h2>お問い合わせ</h2>
    <p>採用に関するご質問・ご応募はこちらからお気軽にどうぞ。</p>
  </div>

  <div class="section">

    <div class="info-box">
      <h3>お電話でのお問い合わせ</h3>
      <div class="tel">092-000-0000</div>
      <p>受付時間：平日 9:00〜18:00</p>
    </div>

    <div class="form-group">
      <label>お名前 <span>必須</span></label>
      <input type="text" placeholder="例：山田 太郎">
    </div>
    <div class="form-group">
      <label>メールアドレス <span>必須</span></label>
      <input type="email" placeholder="例：example@email.com">
    </div>
    <div class="form-group">
      <label>電話番号</label>
      <input type="tel" placeholder="例：090-0000-0000">
    </div>
    <div class="form-group">
      <label>ご希望の職種 <span>必須</span></label>
      <select>
        <option value="">選択してください</option>
        <option>介護スタッフ</option>
        <option>相談員</option>
        <option>事務スタッフ</option>
        <option>その他・未定</option>
      </select>
    </div>
    <div class="form-group">
      <label>メッセージ</label>
      <textarea placeholder="ご質問・ご要望などお気軽にご記入ください。"></textarea>
    </div>

    <button class="submit-btn">送信する</button>
    <a href="index.html" class="back-link">← トップページに戻る</a>

  </div>

  <footer>
    <p>&copy; 2025 株式会社ハルケア</p>
  </footer>

</body>
</html>
